name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the wheel the demo installs
        # The demo runs the real package under Pyodide, so the wheel it fetches
        # has to be rebuilt from this commit rather than served from whatever
        # was committed earlier.
        run: |
          uv build --wheel
          rm -f docs/*.whl
          cp dist/*.whl docs/

      - name: Verify the demo references the wheel it will get
        run: |
          wheel=$(basename docs/*.whl)
          grep -q "$wheel" docs/index.html \
            || { echo "docs/index.html does not reference $wheel"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
